<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>박경지 포트폴리오</title>
<meta name="description" content="고객의 문제를 찾아 실제로 작동하는 AI 서비스로 만드는 박경지입니다.">
<meta property="og:type" content="website">
<meta property="og:title" content="박경지 포트폴리오">
<meta property="og:description" content="고객의 문제를 찾아 실제로 작동하는 AI 서비스로 만드는 박경지입니다.">
<meta property="og:image" content="https://1umbrella-max.github.io/resume_kj/og.jpg?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://1umbrella-max.github.io/resume_kj/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css?v=8">
<style>
.home{padding:32px 32px 40px}
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:4px;background:#fff;border:1px solid rgba(20,22,26,0.12);border-radius:12px}
.tabs button{padding:7px 14px;border:0;border-radius:9px;background:transparent;font:inherit;font-size:14px;font-weight:600;color:rgba(20,22,26,0.65);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--blue-grad);color:#fff}
.search{width:280px;max-width:100%;display:flex;align-items:center;gap:8px;padding:0 12px;height:40px;background:#fff;border:1px solid rgba(20,22,26,0.12);border-radius:10px}
.search input{flex:1;min-width:0;border:0;outline:none;background:transparent;font:inherit;font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* 접고 펴는 카테고리 그룹 */
.group{margin-top:26px}
.group > summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none;padding:6px 0}
.group > summary::-webkit-details-marker{display:none}
.group > summary h2{margin:0;font-size:18px;font-weight:700}
.group > summary .cnt{font-size:13px;font-weight:600;color:var(--muted)}
.group > summary .chev{margin-left:8px}
.group > summary::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--ink)}

/* 폴더 카드 */
.grid{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.folder{position:relative;display:block;height:250px;border-radius:30px;overflow:hidden;background:var(--gray-grad);border:1px solid rgba(20,22,26,0.06);box-shadow:inset 0 1px 0 rgba(255,255,255,0.9),0 2px 6px rgba(20,22,26,0.04);transition:transform .2s,box-shadow .2s}
.folder .s1,.folder .s2{position:absolute;left:22px;right:22px;height:100px;border-radius:12px;background:rgba(255,255,255,0.95)}
.folder .s1{top:16px;left:30px;right:18px;opacity:.65;transform:rotate(-2deg)}
.folder .s2{top:24px;padding:12px 14px;font-size:12px;color:rgba(20,22,26,0.5)}
.folder .s2 img{display:block;height:14px;width:auto;max-width:100%}
.folder .tab{position:absolute;top:62px;right:0;width:58%;height:40px;border-radius:18px 0 0 0}
.folder .front{position:absolute;left:0;right:0;top:86px;bottom:0;border-radius:18px 0 30px 30px;padding:18px 20px;display:flex;flex-direction:column}
.folder .tab,.folder .front{background:linear-gradient(180deg,rgba(255,255,255,0.72) 0%,rgba(236,237,240,0.92) 100%);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.folder .t{font-size:19px;font-weight:700;line-height:1.3}
.folder .c{margin-top:6px;font-size:14px;line-height:1.45;color:rgba(20,22,26,0.72)}
.folder .k{margin-top:auto;align-self:flex-start;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:700;background:var(--blue-grad);color:#fff}
.folder:hover,.folder:focus-visible{transform:translateY(-3px);outline:none;background:linear-gradient(180deg,#7EA7F5 0%,#4F86F0 100%);box-shadow:0 14px 30px rgba(79,134,240,0.3)}
.folder:hover .tab,.folder:hover .front,.folder:focus-visible .tab,.folder:focus-visible .front{background:linear-gradient(180deg,rgba(176,203,250,0.78) 0%,rgba(98,148,242,0.92) 100%)}
.folder:hover .t,.folder:hover .c,.folder:focus-visible .t,.folder:focus-visible .c{color:#fff}
.folder:hover .k,.folder:focus-visible .k{background:#fff;color:var(--blue-text)}
.empty{margin:24px 0 0;padding:24px;text-align:center;background:#fff;border:1px dashed rgba(20,22,26,0.2);border-radius:14px;color:var(--muted)}
.foot{margin-top:20px;font-size:12px;color:var(--muted)}
@media (max-width:640px){.home{padding:22px 16px}}
</style>
</head>
<body>
<div class="wrap">
<div class="app">
<aside class="side" id="side"></aside>

<main class="main home">
<div class="bar">
<div class="tabs" role="group" aria-label="카테고리" id="tabs"></div>
<label class="search">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(20,22,26,0.55)" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
<span class="sr">프로젝트 검색</span>
<input type="search" id="q" placeholder="프로젝트, 발주처 검색">
</label>
</div>
<div id="groups"></div>
<p class="empty" id="empty" hidden>검색 결과가 없습니다.</p>
</main>

</div>
</div>

<script src="analytics.js"></script>
<script src="data.js?v=3"></script>
<script src="nav.js?v=5"></script>
<script>
// 카드 내용은 data.js에서 수정합니다.
const { cats, projects } = window.PF;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const q = document.getElementById('q');
const closed = new Set();
let tab = 'all';

function card(p) {
  const sheet = p.logo ? `<img src="${p.logo}" alt="${esc(p.client)}">` : esc(p.client);
  return `<a class="folder" href="${p.id}.html">
    <span class="s1"></span><span class="s2">${sheet}</span>
    <span class="tab"></span>
    <span class="front"><span class="t">${esc(p.short)}</span><span class="c">${esc(p.result)}</span>
    <span class="k">${esc(p.contrib || p.badge)}</span></span>
  </a>`;
}

function render() {
  const term = q.value.trim().toLowerCase();
  document.getElementById('tabs').innerHTML = [{ id: 'all', name: '전체' }, ...cats].map((c) =>
    `<button type="button" data-tab="${c.id}" aria-pressed="${tab === c.id}">${esc(c.name)}</button>`).join('');
  let total = 0;
  document.getElementById('groups').innerHTML = cats.filter((c) => tab === 'all' || tab === c.id).map((c) => {
    const list = projects.filter((p) => p.cat === c.id && (!term || (p.short + p.client + p.result).toLowerCase().includes(term)));
    total += list.length;
    if (!list.length) return '';
    return `<details class="group" data-cat="${c.id}"${closed.has(c.id) ? '' : ' open'}>
      <summary><h2>${esc(c.name)}</h2><span class="cnt">${list.length}건</span><span class="chev" aria-hidden="true"></span></summary>
      <div class="grid">${list.map(card).join('')}</div></details>`;
  }).join('');
  document.getElementById('empty').hidden = total > 0;
}
document.addEventListener('click', (e) => { const b = e.target.closest('[data-tab]'); if (b) { tab = b.dataset.tab; render(); } });
document.getElementById('groups').addEventListener('toggle', (e) => {
  const d = e.target; if (!d.dataset || !d.dataset.cat) return;
  if (d.open) closed.delete(d.dataset.cat); else closed.add(d.dataset.cat);
}, true);
q.addEventListener('input', render);
render();
</script>
</body>
</html>
